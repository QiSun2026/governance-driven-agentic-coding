# Optional GDAC v2.0 practice template. Freeze and validate it before material
# delegated work begins:
# python practice-kit/tools/validate_contract.py path/to/contract.yaml
schema_version: "2.0"
revision: 1
contract_id: "replace-me"
status: draft

outcome:
  statement: "What verifiable result should exist when this work is done?"

acceptance_criteria:
  - criterion_id: "criterion-1"
    criterion_kind: technical
    description: "A result that can be checked before work is accepted."
    grader: deterministic  # deterministic | rule | model | human

non_goals:
  - "Work that is explicitly outside this task."

risk_tier: low  # low | medium | high
risk_overlays: []  # Add security, privacy, or regulated only when triggered.
risks:
  - risk_id: "risk-1"
    description: "The primary way this delegated task could cause material harm."
    material: true

authority:
  owner:
    owner_id: "replace-me"
    reserved_decisions:
      - "Final acceptance"
      - "Scope, budget, permission, or risk-boundary expansion"
      - "External publication or irreversible action"
  roles:
    - role_id: builder
      principal_id: "builder-agent-or-session"
      context_ref: "builder-context-ref"
      can_write:
        - "Declare exact paths or resources."
      forbidden_actions:
        - "Change acceptance tests without recorded review."
        - "Expand its own authority, budget, or recursion."
    - role_id: verifier
      principal_id: "verifier-agent-or-session"
      context_ref: "fresh-verifier-context-ref"
      can_write: []
      forbidden_actions:
        - "Modify the implementation being verified."
        - "Convert technical verification into Owner acceptance."

budget:
  max_elapsed_minutes: 60
  max_build_retries: 2
  max_total_eval_reruns: 2
  max_total_trials: 10
  max_agent_depth: 1
  token_budget: null  # Keep unknown when reliable usage data is unavailable.

stop_conditions:
  - "A required input, authority, or acceptance test is missing."
  - "The task requires scope or permission outside this contract."
  - "A retry, trial, time, token, or Agent-depth budget is exhausted."
  - "A material verifier or red-team finding remains unresolved."

evidence_requirements:
  - claim_id: "criterion-1"
    required_types:
      - deterministic_test
    insufficient_action: block

handoff:
  required_outputs:
    - "Exact changed artifacts or governed object reference."
    - "Checks run and their results."
    - "Known limitations and unresolved items."
    - "Owner disposition still required, if any."
