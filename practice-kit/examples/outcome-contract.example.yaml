schema_version: "2.0"
revision: 1
contract_id: "gdac-v20-contract-validator"
status: frozen

outcome:
  statement: "A reviewer can reject malformed Outcome Contracts before delegated work begins."

acceptance_criteria:
  - criterion_id: "schema-valid"
    criterion_kind: technical
    description: "The filled example validates against the published JSON Schema."
    grader: deterministic
  - criterion_id: "negative-case"
    criterion_kind: technical
    description: "A contract missing Owner authority exits non-zero with a useful error."
    grader: deterministic

non_goals:
  - "Proving that the contract improves real-world project outcomes."
  - "Authorizing publication of a future method revision."

risk_tier: medium
risk_overlays: []
risks:
  - risk_id: "invalid-contract-accepted"
    description: "Malformed authority or evidence fields could be treated as a valid delegation."
    material: true

authority:
  owner:
    owner_id: "Qi Sun"
    reserved_decisions:
      - "Accept or reject a future method release."
      - "Authorize external publication."
  roles:
    - role_id: builder
      principal_id: "builder-session"
      context_ref: "validator-build-context"
      can_write:
        - "practice-kit/schemas"
        - "practice-kit/tools"
        - "tests"
      forbidden_actions:
        - "Modify published release artifacts."
        - "Publish or expand its own authority."
    - role_id: verifier
      principal_id: "verifier-session"
      context_ref: "validator-fresh-review-context"
      can_write: []
      forbidden_actions:
        - "Modify the contract or validator under review."
        - "Convert a test pass into Owner acceptance."

budget:
  max_elapsed_minutes: 120
  max_build_retries: 2
  max_total_eval_reruns: 2
  max_total_trials: 10
  max_agent_depth: 1
  token_budget: null

stop_conditions:
  - "A published release artifact changes."
  - "The example passes only after weakening a required control."
  - "A dependency or test result cannot be reproduced."

evidence_requirements:
  - claim_id: "schema-valid"
    required_types:
      - deterministic_test
    insufficient_action: block
  - claim_id: "negative-case"
    required_types:
      - deterministic_test
    insufficient_action: block

handoff:
  required_outputs:
    - "Changed artifact list."
    - "Test commands and results."
    - "Known limits and remaining Owner decisions."
